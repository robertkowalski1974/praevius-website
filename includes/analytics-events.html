<!-- Praevius Analytics Event Tracking -->
<!--
  Event model (one dataLayer event per click):
    sign_up_click        Free sign-up CTA (/login, data-plan="free")
    login_click          Navbar "Login" link
    free_trial_click     Paid-plan trial CTA (start-trial?bundle=...)
    contact_sales_click  data-cta="contact-sales" or data-plan="scale"
    cta_click            Any other .btn click
    outbound_link_click  Link to another site (not a CTA)
    generate_lead        Contact form, only after the API returns OK
    scroll_depth         25 / 50 / 75 / 90 %
    chatbot_opened       Pipedrive LeadBooster opened
  Plan and value come from data-plan (fallback: bundle= in href; /login = free).
  Prices: claims sheet, USD per month.
-->
<script>
(function () {
  'use strict';
  window.dataLayer = window.dataLayer || [];

  var PLAN_VALUE = { free: 0, essential: 99, professional: 229, scale: 449 };

  function push(eventName, params) {
    var data = { event: eventName, page_path: window.location.pathname };
    for (var k in params) {
      if (Object.prototype.hasOwnProperty.call(params, k) && params[k] !== undefined) data[k] = params[k];
    }
    window.dataLayer.push(data);
  }

  function getLocation(el) {
    if (el.closest('nav, .navbar, header')) return 'navbar';
    if (el.closest('footer, .footer, .nav-footer')) return 'footer';
    if (el.closest('.hero-section, [class*="hero"]')) return 'hero';
    if (el.closest('[class*="pricing"]')) return 'pricing_section';
    return 'body';
  }

  function getPlan(el, href) {
    var plan = (el.getAttribute('data-plan') || '').toLowerCase();
    if (!plan) {
      var m = href.match(/[?&]bundle=([a-z]+)/i);
      if (m) plan = m[1].toLowerCase();
      else if (/\/login(\b|$|\?)/.test(href)) plan = 'free';
    }
    return Object.prototype.hasOwnProperty.call(PLAN_VALUE, plan) ? plan : undefined;
  }

  // ------------------------------------------
  // Clicks: a single delegated listener
  // ------------------------------------------
  document.addEventListener('click', function (e) {
    var el = e.target && e.target.closest ? e.target.closest('a, button') : null;
    if (!el) return;
    if (el.type === 'submit' && el.closest('form')) return; // forms tracked on API success

    var href = el.getAttribute('href') || '';
    var cta = (el.getAttribute('data-cta') || '').toLowerCase();
    var location = getLocation(el);
    var plan = getPlan(el, href);
    var params = {
      cta_id: cta || undefined,
      cta_text: (el.textContent || '').trim().slice(0, 100),
      cta_url: href,
      cta_location: location
    };
    if (plan) {
      params.plan_type = plan;
      params.plan_interest = plan; // kept for the existing GTM variable
      params.value = PLAN_VALUE[plan];
      params.currency = 'USD';
    }

    var name = null;
    if (cta === 'contact-sales' || plan === 'scale') {
      name = 'contact_sales_click';
    } else if (href.indexOf('start-trial') !== -1) {
      name = 'free_trial_click';
    } else if (/\/login(\b|$|\?)/.test(href)) {
      name = (location === 'navbar' && !cta) ? 'login_click' : 'sign_up_click';
      if (name === 'login_click') {
        delete params.plan_type; delete params.plan_interest; delete params.value; delete params.currency;
      }
    } else if (el.classList.contains('btn')) {
      name = 'cta_click';
    } else if (/^https?:\/\//i.test(href) && el.hostname && el.hostname !== window.location.hostname && el.hostname.indexOf('praevius.app') === -1) {
      name = 'outbound_link_click';
      params = { link_url: el.href, link_text: params.cta_text };
    }

    if (name) push(name, params);
  }, true);

  // ------------------------------------------
  // Contact form: fire only after API success
  // The form script in contact.qmd shows #formStatus with
  // "Message sent!" only when fetch() returns response.ok.
  // ------------------------------------------
  function initContactForm() {
    var form = document.getElementById('contactForm');
    var status = document.getElementById('formStatus');
    if (!form || !status || typeof MutationObserver === 'undefined') return;

    var lastTopic;
    var sent = false;

    // Read the topic before the success handler resets the form.
    form.addEventListener('submit', function () {
      lastTopic = form.topic ? form.topic.value : undefined;
      sent = false;
    });

    new MutationObserver(function () {
      var visible = status.style.display !== 'none';
      var ok = visible && /^\s*Message sent!/.test(status.textContent || '');
      if (ok && !sent) {
        sent = true;
        push('generate_lead', {
          form_id: 'contactForm',
          form_location: 'contact_page',
          lead_topic: lastTopic,
          lead_source: 'contact_form'
        });
      }
      if (!visible) sent = false;
    }).observe(status, { attributes: true, attributeFilter: ['style'], childList: true, subtree: true });
  }

  // ------------------------------------------
  // Scroll depth
  // ------------------------------------------
  var depths = [25, 50, 75, 90];
  var reached = {};
  window.addEventListener('scroll', function () {
    var max = document.documentElement.scrollHeight - window.innerHeight;
    if (max <= 0) return;
    var pct = Math.round((window.scrollY / max) * 100);
    for (var i = 0; i < depths.length; i++) {
      if (pct >= depths[i] && !reached[depths[i]]) {
        reached[depths[i]] = true;
        push('scroll_depth', { scroll_percentage: depths[i] });
      }
    }
  }, { passive: true });

  // ------------------------------------------
  // Pipedrive LeadBooster (stub is defined after this file)
  // ------------------------------------------
  function initChatbot() {
    var lb = window.LeadBooster;
    if (lb && typeof lb.on === 'function') {
      lb.on('open', function () { push('chatbot_opened', { chatbot_type: 'pipedrive_leadbooster' }); });
    }
  }

  function init() { initContactForm(); initChatbot(); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
